<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优城美市 · Our Block</title>
<meta name="description" content="Your block, in good hands — together. A place-based civic wellbeing app where neighbours notice the good and flag what needs care, then act.">
<meta name="theme-color" content="#234E3F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/styles.css">
<!-- Apply the saved theme before first paint to avoid a flash. Default: liquid glass. -->
<script>try{var th=localStorage.getItem('ob.theme')||'glass';if(th!=='light')document.documentElement.setAttribute('data-theme','glass');}catch(e){document.documentElement.setAttribute('data-theme','glass');}</script>
</head>
<body>
  <div id="app"><div class="spinner"></div></div>
  <!-- Leaflet (self-hosted) — classic script runs before the deferred module, so window.L is ready. -->
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
  <!-- App-wide contextual "?" help — idempotent IIFE, works on public + authed views. -->
  <script src="/contextual-help.js?v=1"></script>
</body>
</html>
