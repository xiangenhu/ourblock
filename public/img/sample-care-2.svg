<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Litter piling up at the canal steps">
  <defs>
    <linearGradient id="c2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE8DA"/><stop offset="1" stop-color="#CBD8D6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="420" fill="url(#c2sky)"/>
  <!-- canal water -->
  <rect y="300" width="640" height="120" fill="#9FBEC0"/>
  <g stroke="#B6CFD0" stroke-width="4" fill="none" opacity=".7"><path d="M0 330 q40 -8 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/><path d="M0 360 q40 -8 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/></g>
  <!-- steps down to the water -->
  <g fill="#C9BFA6">
    <rect x="0" y="210" width="420" height="26"/><rect x="0" y="236" width="380" height="26" fill="#BEB39A"/><rect x="0" y="262" width="340" height="26"/><rect x="0" y="288" width="300" height="26" fill="#BEB39A"/>
  </g>
  <!-- scattered litter -->
  <g>
    <rect x="120" y="196" width="26" height="16" rx="4" fill="#C0613A" transform="rotate(-12 133 204)"/>
    <circle cx="210" cy="226" r="10" fill="#E2A02E"/>
    <rect x="250" y="250" width="30" height="14" rx="4" fill="#7E8BA0" transform="rotate(8 265 257)"/>
    <path d="M90 250 l18 6 l-6 16 l-16 -6 z" fill="#D9648E"/>
    <circle cx="170" cy="276" r="8" fill="#6E7A80"/>
    <rect x="300" y="206" width="22" height="14" rx="4" fill="#3FAE6B" transform="rotate(16 311 213)"/>
  </g>
  <!-- overflowing bin -->
  <g transform="translate(470,196)">
    <rect x="0" y="40" width="90" height="110" rx="8" fill="#5C6157"/>
    <rect x="-6" y="30" width="102" height="16" rx="6" fill="#46494200"/>
    <rect x="-6" y="28" width="102" height="16" rx="6" fill="#737970"/>
    <circle cx="18" cy="22" r="9" fill="#C0613A"/><circle cx="44" cy="14" r="10" fill="#E2A02E"/><circle cx="70" cy="22" r="9" fill="#7E8BA0"/>
  </g>
</svg>
